# Construit, envoie, migre, bascule.
#
# Les identifiants du serveur vivent dans les secrets du dépôt, jamais dans le
# code ni dans une conversation. Rien ici n'a besoin d'être lu par un humain
# pour fonctionner, et personne d'autre que GitHub ne voit la clé.
#
# Se déclenche à la main, ou sur une poussée vers main. Tant que rien n'est
# poussé sur main, rien ne part.

name: déploiement

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    # Un environnement GitHub permet d'exiger une approbation manuelle avant
    # que le job ne démarre : Settings → Environments → production.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: construire
        run: |
          npm ci
          npm run build

      - name: la clé
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$CLE"   || { echo "secret DEPLOY_SSH_KEY manquant"; exit 1; }
          test -n "$HOTES" || { echo "secret DEPLOY_KNOWN_HOSTS manquant"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # L'empreinte du serveur est vérifiée, elle n'est pas désactivée.
          # StrictHostKeyChecking=no offrirait la clé de déploiement à qui
          # sait se mettre sur le chemin du runner.
          printf '%s\n' "$HOTES" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: envoyer
        env:
          # Une variable, ou un secret du même nom. Un nom d'hôte n'est pas un
          # secret et sa place est dans « Variables » — mais le poser dans
          # l'autre onglet est l'erreur qu'on fait une fois, et refuser de
          # partir pour ça ne protège personne.
          HOTE: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          RACINE: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
        run: |
          # Toutes les manquantes d'un coup. S'arrêter à la première oblige à
          # relancer le déploiement une fois par variable pour découvrir la
          # suivante, ce qui est un jeu de piste, pas un diagnostic.
          manque=""
          for paire in HOTE:DEPLOY_HOST UTILISATEUR:DEPLOY_USER RACINE:DEPLOY_PATH; do
            nom="${paire%%:*}"
            [ -n "${!nom}" ] || manque="$manque ${paire##*:}"
          done
          if [ -n "$manque" ]; then
            echo "manquant :$manque"
            echo "Settings → Secrets and variables → Actions → onglet « Variables »"
            echo "(un secret du même nom fait l'affaire aussi)"
            exit 1
          fi
          CIBLE="$RACINE/releases/${{ github.sha }}"
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT"

          # « Host key verification failed » est l'échec le plus opaque du
          # déploiement : il ne dit ni ce que le serveur présente, ni ce qui
          # est posé, ni lequel des deux est en cause. Les empreintes sont
          # publiques — les afficher côte à côte coûte trois lignes et évite
          # de relancer un déploiement pour deviner.
          if ! $SSH -o BatchMode=yes -o ConnectTimeout=10 \
                 "$UTILISATEUR@$HOTE" true 2>/tmp/ssh.log; then
            echo "--- ce que ssh a dit ---"
            cat /tmp/ssh.log
            echo "--- les empreintes posées (DEPLOY_KNOWN_HOSTS) ---"
            ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null || echo "(aucune lisible)"
            echo "--- celles que le serveur présente à l'adresse visée ---"
            ssh-keyscan -T 10 -p "$PORT" "$HOTE" 2>/dev/null \
              | ssh-keygen -lf - 2>/dev/null || echo "(injoignable sur ce port)"
            echo
            echo "Si les empreintes coïncident, c'est le NOM qui diffère :"
            echo "ssh-keyscan -H hache le nom d'hôte, donc l'entrée ne vaut que"
            echo "pour la chaîne EXACTE passée au scan. Rescanne avec la valeur"
            echo "de DEPLOY_HOST, au caractère près."
            echo "Si elles diffèrent, ce n'est pas le même serveur."
            echo "Si ssh a dit « Permission denied », l'empreinte est bonne et"
            echo "c'est la clé publique qui manque dans authorized_keys."
            exit 1
          fi

          $SSH "$UTILISATEUR@$HOTE" "mkdir -p '$CIBLE' '$RACINE/var'"
          # Ce qui part : le build, le serveur, le schéma, les scripts. Pas src/,
          # pas les tests, pas le classeur — le serveur n'en a pas l'usage.
          rsync -az --delete -e "$SSH" \
            dist/ "$UTILISATEUR@$HOTE:$CIBLE/dist/"
          rsync -az --delete -e "$SSH" \
            server/ "$UTILISATEUR@$HOTE:$CIBLE/server/"
          rsync -az --delete -e "$SSH" \
            db/ "$UTILISATEUR@$HOTE:$CIBLE/db/"
          rsync -az --delete -e "$SSH" \
            scripts/ "$UTILISATEUR@$HOTE:$CIBLE/scripts/"
          rsync -az -e "$SSH" \
            package.json package-lock.json "$UTILISATEUR@$HOTE:$CIBLE/"
          rsync -az -e "$SSH" \
            deploy/liberer.sh "$UTILISATEUR@$HOTE:$CIBLE/"

      - name: migrer et basculer
        env:
          # Une variable, ou un secret du même nom. Un nom d'hôte n'est pas un
          # secret et sa place est dans « Variables » — mais le poser dans
          # l'autre onglet est l'erreur qu'on fait une fois, et refuser de
          # partir pour ça ne protège personne.
          HOTE: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          RACINE: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$UTILISATEUR@$HOTE" \
            "bash '$RACINE/releases/${{ github.sha }}/liberer.sh' '$RACINE' '${{ github.sha }}'"

      - name: vérifier
        env:
          URL: ${{ vars.DEPLOY_URL || secrets.DEPLOY_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "variable DEPLOY_URL non définie — pas de vérification en ligne"
            exit 0
          fi
          for i in $(seq 1 20); do
            REPONSE=$(curl -fsS --max-time 10 "$URL/api/sante" 2>/dev/null) && break
            sleep 3
          done
          test -n "${REPONSE:-}" || { echo "le serveur ne répond pas après le déploiement"; exit 1; }
          echo "$REPONSE"
          # `ok` seul ne dit pas que tout est configuré : les trois autres
          # drapeaux disent ce qui manque encore.
          echo "$REPONSE" | grep -q '"ok":true' || exit 1
          echo "$REPONSE" | grep -q '"scellement":true' \
            || echo "⚠ MSC_SECRET_KEY absente sur le serveur : ni sessions ni jetons Strava"
