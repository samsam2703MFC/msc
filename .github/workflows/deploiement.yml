# Construit, envoie, migre, bascule.
#
# Les identifiants du serveur vivent dans les secrets du dépôt, jamais dans le
# code ni dans une conversation. Rien ici n'a besoin d'être lu par un humain
# pour fonctionner, et personne d'autre que GitHub ne voit la clé.
#
# Se déclenche à la main, ou sur une poussée vers main. Tant que rien n'est
# poussé sur main, rien ne part.

name: déploiement

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploiement
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    # Un environnement GitHub permet d'exiger une approbation manuelle avant
    # que le job ne démarre : Settings → Environments → production.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: construire
        run: |
          npm ci
          npm run build
          # Le classeur, empaqueté ici. `db:seed` bundle scripts/db-seed.ts, qui
          # importe src/data/ — et src/ ne part pas au serveur, à dessein. Le
          # lancer là-bas installait esbuild sur la production pour échouer sur
          # des imports absents ; l'empaqueter ici rend un fichier autonome et
          # laisse la machine de production sans outil de build, ce qui était le
          # but du découpage.
          npm run db:seed:paquet

      - name: la clé
        env:
          CLE: ${{ secrets.DEPLOY_SSH_KEY }}
          HOTES: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$CLE"   || { echo "secret DEPLOY_SSH_KEY manquant"; exit 1; }
          test -n "$HOTES" || { echo "secret DEPLOY_KNOWN_HOSTS manquant"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Une clé privée mal collée ne se manifeste que par « error in
          # libcrypto » suivi de « Permission denied » : deux messages qui ne
          # disent pas où est le problème. Deux réparations déterministes, et
          # l'original est gardé tant que la réparation n'est pas validée —
          # réparer en pire est la seule façon de rendre ceci nuisible.
          valide() { ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; }
          cp ~/.ssh/id_deploy ~/.ssh/id_deploy.recu

          # 1 · l'enveloppe est restée derrière. Le corps d'une clé OpenSSH
          #     commence toujours par le base64 de « openssh-key-v1 ».
          if ! valide && head -1 ~/.ssh/id_deploy | grep -q '^b3BlbnNzaC1rZXktdjE'; then
            {
              echo "-----BEGIN OPENSSH PRIVATE KEY-----"
              grep -v '^-----' ~/.ssh/id_deploy.recu
              echo "-----END OPENSSH PRIVATE KEY-----"
            } > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            valide && echo "::warning::enveloppe BEGIN/END reconstituée."
          fi

          # 2 · les sauts de ligne du corps ont disparu. On replie à 70
          #     colonnes, qui est la mise en forme d'origine.
          if ! valide; then
            corps=$(tr -d ' \t\r\n' < ~/.ssh/id_deploy.recu \
                    | sed -e 's/-----BEGINOPENSSHPRIVATEKEY-----//' \
                          -e 's/-----ENDOPENSSHPRIVATEKEY-----//')
            if [ -n "$corps" ]; then
              {
                echo "-----BEGIN OPENSSH PRIVATE KEY-----"
                printf '%s\n' "$corps" | fold -w 70
                echo "-----END OPENSSH PRIVATE KEY-----"
              } > ~/.ssh/id_deploy
              chmod 600 ~/.ssh/id_deploy
              valide && echo "::warning::sauts de ligne du corps reconstitués."
            fi
          fi

          # 3 · une ligne de base64. C'est la forme qui ne se casse pas : ni
          #     tiret, ni barre verticale, ni saut de ligne — rien qu'une
          #     sélection à la souris ou un champ de formulaire puisse manger.
          #        base64 -w0 ~/.ssh/msc_deploy
          #     On ne cherche PAS à reconnaître du base64 avant d'essayer. Une
          #     version précédente le faisait avec ^[A-Za-z0-9+/=]+$ et refusait
          #     une clé parfaitement bonne pour un caractère invisible glissé
          #     par un champ de formulaire. `base64 -di` ignore ce qui n'est pas
          #     de l'alphabet, et `ssh-keygen` tranche derrière : le seul juge
          #     utile est « est-ce que ça donne une clé », pas « est-ce que ça
          #     ressemble à du base64 ».
          if ! valide; then
            if tr -d ' \t\r\n' < ~/.ssh/id_deploy.recu | base64 -di > ~/.ssh/id_deploy 2>/dev/null; then
              chmod 600 ~/.ssh/id_deploy
              valide && echo "::warning::clé décodée depuis du base64."
            fi
          fi

          if ! valide; then
            # Ce que ssh-keygen dit, LUI, sur le meilleur candidat obtenu.
            # Trois réparations et six diagnostics plus tard, c'est la seule
            # chose qu'on n'avait jamais regardée : « error in libcrypto » n'est
            # pas la même chose que « load failed » ni qu'une demande de phrase
            # de passe, et lui seul fait la différence.
            echo "Ce que ssh-keygen répond :"
            ssh-keygen -y -f ~/.ssh/id_deploy 2>&1 > /dev/null | sed 's/^/  /' || true
            cp ~/.ssh/id_deploy.recu ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            echo "DEPLOY_SSH_KEY n'est pas une clé privée exploitable,"
            echo "et ni l'enveloppe ni le repli des lignes ne l'ont réparée."
            # La longueur tranche là où la forme ne dit rien : une clé ed25519
            # fait ~400 octets, ~540 en base64. Vingt caractères, ce n'est pas
            # une clé abîmée — c'est autre chose qui a été collé.
            echo "Reçu : $(wc -l < ~/.ssh/id_deploy.recu) ligne(s), $(wc -c < ~/.ssh/id_deploy.recu) caractères."
            echo "Attendu : ~540 caractères en base64, ~400 lignes de PEM sur ~10 lignes."
            case "$(head -1 ~/.ssh/id_deploy.recu | cut -d' ' -f1)" in
              ssh-*|ecdsa-*|sk-*)
                echo "→ c'est une clé PUBLIQUE (.pub). Il faut la privée :"
                echo "  le fichier SANS l'extension, « cat ~/.ssh/msc_deploy »." ;;
              '-----BEGIN'*)
                echo "→ l'enveloppe est là. Ce sont donc les sauts de ligne du"
                echo "  corps qui manquent, ou la clé est chiffrée par une"
                echo "  phrase de passe — un runner ne peut pas la taper." ;;
              *) echo "→ ni une clé publique, ni une enveloppe, ni du base64."
                 # Les caractères hors alphabet, et eux seuls : ils ne peuvent
                 # pas porter de matière secrète, puisque tout le reste est
                 # supprimé — et ce sont eux qui font échouer un décodage.
                 hors=$(tr -d ' \t\r\n' < ~/.ssh/id_deploy.recu | tr -d 'A-Za-z0-9+/=' | head -c 24)
                 if [ -n "$hors" ]; then
                   echo "  Caractères hors base64 : $(printf '%s' "$hors" | cat -v)"
                 else
                   # Du base64 pur qui ne donne pas de clé : ce sont les huit
                   # premiers caractères qui disent ce qui a été encodé, et ils
                   # sont les mêmes pour toutes les clés — un en-tête, pas un
                   # secret.
                   #   LS0tLS1C…  base64 d'un PEM  (attendu)
                   #   b3BlbnNz…  le corps d'une clé, sans enveloppe
                   #   c3NoLWVk…  base64 d'un .pub — la moitié publique
                   tete=$(tr -d ' \t\r\n' < ~/.ssh/id_deploy.recu | head -c 8)
                   echo "  C'est du base64 pur, mais il ne donne pas de clé."
                   echo "  Ses huit premiers caractères : $tete"
                   # Les deux nombres que preparer.sh imprime de son côté. S'ils
                   # ne coïncident pas, la ligne a été tronquée au collage — et
                   # une troncature donne exactement « error in libcrypto », un
                   # message qui ne parle jamais de longueur.
                   propre=$(tr -d ' \t\r\n' < ~/.ssh/id_deploy.recu)
                   echo "  Longueur reçue : $(printf '%s' "$propre" | wc -c) caractères"
                   echo "  Empreinte reçue : $(printf '%s' "$propre" | sha256sum | cut -c1-12)"
                   echo "  preparer.sh imprime ces deux nombres pour la clé du serveur."
                   echo "  S'ils diffèrent, la ligne a été coupée en la copiant."
                   echo "    LS0tLS1C = un PEM encodé, c'est ce qu'on attend"
                   echo "    c3NoLWVk = un .pub encodé — c'est la moitié publique"
                   echo "  Décodé, ça commence par : $(tr -d ' \t\r\n' < ~/.ssh/id_deploy.recu | base64 -di 2>/dev/null | head -c 20 | cat -v)"
                 fi
                 echo "  Le plus sûr : sur le serveur, « base64 -w0 ~/.ssh/msc_deploy »"
                 echo "  et colle cette unique ligne — elle ne contient rien qu'un"
                 echo "  collage puisse abîmer." ;;
            esac
            exit 1
          fi
          rm -f ~/.ssh/id_deploy.recu
          # L'empreinte du serveur est vérifiée, elle n'est pas désactivée.
          # StrictHostKeyChecking=no offrirait la clé de déploiement à qui
          # sait se mettre sur le chemin du runner.
          # Le secret d'abord, le fichier du dépôt ensuite. Un secret qui ne
          # contient pas de clé n'est pas un secret qu'il faut préférer.
          printf '%s\n' "$HOTES" > ~/.ssh/known_hosts
          if ! ssh-keygen -lf ~/.ssh/known_hosts > /dev/null 2>&1; then
            if [ -s deploy/known_hosts ] && ssh-keygen -lf deploy/known_hosts > /dev/null 2>&1; then
              echo "DEPLOY_KNOWN_HOSTS illisible — on épingle depuis deploy/known_hosts."
              cp deploy/known_hosts ~/.ssh/known_hosts
            fi
          fi
          chmod 600 ~/.ssh/known_hosts

          # Un secret non vide n'est pas un secret valide. `ssh-keyscan` écrit
          # ses lignes de commentaire sur stderr (« # hôte:22 SSH-2.0-… ») et
          # ses clés sur stdout ; coller les deux, ou une liste d'empreintes,
          # donne un fichier que ssh lit sans y trouver de clé — et l'échec
          # arrive alors à la connexion, sous la forme la plus opaque qui soit.
          if ! ssh-keygen -lf ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "Ni DEPLOY_KNOWN_HOSTS ni deploy/known_hosts ne contient de clé lisible."
            echo "Attendu : la sortie de « ssh-keyscan -H <hôte> 2>/dev/null »,"
            echo "une clé par ligne, chacune commençant par |1| ou par l'hôte."
            echo "Reçu : $(wc -l < ~/.ssh/known_hosts) ligne(s)."
            # Dire COMBIEN de lignes n'a pas suffi à deux reprises. Le premier
            # champ de la première ligne suffit à nommer ce qui a été collé, et
            # il ne divulgue rien : ce sont tous des mots publics.
            case "$(head -1 ~/.ssh/known_hosts | cut -d' ' -f1)" in
              '#'*)      echo "→ on dirait une ligne de commentaire de ssh-keyscan."
                         echo "  Elles sortent sur stderr : ajoute 2>/dev/null." ;;
              '|1|'*)    echo "→ on dirait une entrée hachée, mais tronquée."
                         echo "  Une ligne fait ~150 caractères et ne doit pas être coupée." ;;
              ssh-*|ecdsa-*|sk-*)
                         echo "→ on dirait une clé SANS le nom d'hôte devant."
                         echo "  Un fichier .pub n'est pas un known_hosts : celui de la clé"
                         echo "  de déploiement va dans authorized_keys, sur le serveur." ;;
              '-----BEGIN'*)
                         echo "→ c'est un bloc de clé PRIVÉE. Elle n'a rien à faire ici :"
                         echo "  elle va dans DEPLOY_SSH_KEY, et nulle part ailleurs." ;;
              [0-9]*)    echo "→ on dirait une liste d'empreintes (ssh-keygen -l)."
                         echo "  Il faut la sortie brute du scan, pas ses empreintes." ;;
              *)         echo "→ premier mot inattendu ; ce n'est pas une sortie de scan."
                         # Une clé d'hôte est publique par construction — c'est
                         # tout l'objet de la publier. En montrer le début quand
                         # rien d'autre n'a marché ne divulgue rien, et c'est le
                         # seul moyen de nommer ce qui a été collé.
                         echo "  Début de la ligne : $(head -1 ~/.ssh/known_hosts | cut -c1-12)"
                         echo "  Longueur : $(head -1 ~/.ssh/known_hosts | wc -c) caractères"
                         echo "  (une entrée valide en fait ~100 à 600)" ;;
            esac
            exit 1
          fi

          # Deux empreintes, à comparer d'un coup d'œil quand ça se passe mal.
          echo "Clé de déploiement : $(ssh-keygen -lf ~/.ssh/id_deploy | cut -d' ' -f1,2)"
          echo "Hôtes connus       : $(ssh-keygen -lf ~/.ssh/known_hosts | wc -l) empreinte(s)"

      - name: envoyer
        env:
          # Une variable, ou un secret du même nom. Un nom d'hôte n'est pas un
          # secret et sa place est dans « Variables » — mais le poser dans
          # l'autre onglet est l'erreur qu'on fait une fois, et refuser de
          # partir pour ça ne protège personne.
          HOTE: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          RACINE: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
        run: |
          # Toutes les manquantes d'un coup. S'arrêter à la première oblige à
          # relancer le déploiement une fois par variable pour découvrir la
          # suivante, ce qui est un jeu de piste, pas un diagnostic.
          manque=""
          for paire in HOTE:DEPLOY_HOST UTILISATEUR:DEPLOY_USER RACINE:DEPLOY_PATH; do
            nom="${paire%%:*}"
            [ -n "${!nom}" ] || manque="$manque ${paire##*:}"
          done
          if [ -n "$manque" ]; then
            echo "manquant :$manque"
            echo "Settings → Secrets and variables → Actions → onglet « Variables »"
            echo "(un secret du même nom fait l'affaire aussi)"
            exit 1
          fi
          CIBLE="$RACINE/releases/${{ github.sha }}"
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT"

          # « Host key verification failed » est l'échec le plus opaque du
          # déploiement : il ne dit ni ce que le serveur présente, ni ce qui
          # est posé, ni lequel des deux est en cause. Les empreintes sont
          # publiques — les afficher côte à côte coûte trois lignes et évite
          # de relancer un déploiement pour deviner.
          if ! $SSH -o BatchMode=yes -o ConnectTimeout=10 \
                 "$UTILISATEUR@$HOTE" true 2>/tmp/ssh.log; then
            echo "--- ce que ssh a dit ---"
            cat /tmp/ssh.log
            echo "--- les empreintes posées (secret, ou deploy/known_hosts) ---"
            ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null || echo "(aucune lisible)"
            echo "--- celles que le serveur présente à l'adresse visée ---"
            ssh-keyscan -T 10 -p "$PORT" "$HOTE" 2>/dev/null \
              | ssh-keygen -lf - 2>/dev/null || echo "(injoignable sur ce port)"
            echo
            echo "Si les empreintes coïncident, c'est le NOM qui diffère :"
            echo "ssh-keyscan -H hache le nom d'hôte, donc l'entrée ne vaut que"
            echo "pour la chaîne EXACTE passée au scan. Rescanne avec la valeur"
            echo "de DEPLOY_HOST, au caractère près."
            echo "Si elles diffèrent, ce n'est pas le même serveur."
            echo "Si ssh a dit « Permission denied », l'empreinte est bonne et"
            echo "c'est la clé publique qui manque dans authorized_keys —"
            echo "ou bien on ne frappe pas à la bonne porte :"
            # DEPLOY_USER et DEPLOY_PATH masqués, on ne peut pas les lire dans
            # le journal. Une comparaison, elle, n'est pas un secret : elle dit
            # ce qu'il faut savoir sans rien divulguer. C'est aussi pourquoi ces
            # deux-là ont leur place dans « Variables » — un nom d'utilisateur
            # masqué coûte un aller-retour à chaque diagnostic.
            [ "$UTILISATEUR" = "msc" ] \
              && echo "  DEPLOY_USER vaut bien « msc »" \
              || echo "  ⚠ DEPLOY_USER ne vaut PAS « msc » — c'est là qu'est le refus."
            [ "$RACINE" = "/srv/msc" ] \
              && echo "  DEPLOY_PATH vaut bien « /srv/msc »" \
              || echo "  ⚠ DEPLOY_PATH ne vaut PAS « /srv/msc »."
            echo "  (preparer.sh installe la clé pour l'utilisateur « msc »"
            echo "   dans « /srv/msc » ; tout autre couple frappe ailleurs.)"
            exit 1
          fi

          $SSH "$UTILISATEUR@$HOTE" "mkdir -p '$CIBLE' '$RACINE/var'"
          # Ce qui part : le build, le serveur, le schéma, les scripts. Pas src/,
          # pas les tests, pas le classeur — le serveur n'en a pas l'usage.
          rsync -az --delete -e "$SSH" \
            dist/ "$UTILISATEUR@$HOTE:$CIBLE/dist/"
          rsync -az --delete -e "$SSH" \
            server/ "$UTILISATEUR@$HOTE:$CIBLE/server/"
          rsync -az --delete -e "$SSH" \
            db/ "$UTILISATEUR@$HOTE:$CIBLE/db/"
          rsync -az --delete -e "$SSH" \
            scripts/ "$UTILISATEUR@$HOTE:$CIBLE/scripts/"
          rsync -az -e "$SSH" \
            package.json package-lock.json "$UTILISATEUR@$HOTE:$CIBLE/"
          rsync -az --delete -e "$SSH" \
            outils/ "$UTILISATEUR@$HOTE:$CIBLE/outils/"
          rsync -az -e "$SSH" \
            deploy/liberer.sh "$UTILISATEUR@$HOTE:$CIBLE/"

      - name: migrer et basculer
        env:
          # Une variable, ou un secret du même nom. Un nom d'hôte n'est pas un
          # secret et sa place est dans « Variables » — mais le poser dans
          # l'autre onglet est l'erreur qu'on fait une fois, et refuser de
          # partir pour ça ne protège personne.
          HOTE: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          UTILISATEUR: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
          RACINE: ${{ vars.DEPLOY_PATH || secrets.DEPLOY_PATH }}
          PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$PORT" "$UTILISATEUR@$HOTE" \
            "bash '$RACINE/releases/${{ github.sha }}/liberer.sh' '$RACINE' '${{ github.sha }}'"

      - name: vérifier
        env:
          URL: ${{ vars.DEPLOY_URL || secrets.DEPLOY_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "variable DEPLOY_URL non définie — pas de vérification en ligne"
            exit 0
          fi
          # Cinq essais, pas vingt : l'étape précédente a déjà obtenu une
          # réponse sur la boucle locale, donc l'application est debout et
          # n'a pas besoin qu'on l'attende. Vingt essais de dix secondes,
          # c'était quatre minutes pour apprendre la même chose.
          for _ in $(seq 1 5); do
            SORTIE=$(curl -fsS --max-time 10 "$URL/api/sante" 2>&1) \
              && { REPONSE=$SORTIE; break; }
            sleep 3
          done
          if [ -z "${REPONSE:-}" ]; then
            # Ce que curl a dit, plutôt que ce que j'en déduis. Jeter cette
            # ligne dans /dev/null a déjà coûté six diagnostics sur la clé SSH.
            echo "::error::l'application tourne, l'adresse ne répond pas"
            echo "curl : $SORTIE"
            echo
            echo "L'étape d'avant a eu {\"ok\":true} sur 127.0.0.1 : ce n'est donc"
            echo "pas un déploiement à défaire, c'est la porte d'entrée qui manque."
            echo "Sur le serveur, en root :  bash deploy/publier.sh <domaine>"
            echo "Sans domaine : <ip>.sslip.io en est un, gratuit et immédiat."
            echo
            echo "Et si DEPLOY_URL est un secret, mets-la en variable : masquée,"
            echo "une URL fausse reste invisible ici, ce qui est exactement le"
            echo "moment où on aurait besoin de la lire."
            exit 1
          fi
          echo "$REPONSE"
          # `ok` seul ne dit pas que tout est configuré : les trois autres
          # drapeaux disent ce qui manque encore.
          echo "$REPONSE" | grep -q '"ok":true' || exit 1
          echo "$REPONSE" | grep -q '"scellement":true' \
            || echo "⚠ MSC_SECRET_KEY absente sur le serveur : ni sessions ni jetons Strava"
